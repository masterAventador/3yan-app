name: sanyan_auth
description: Auth business module (login, register, splash)
publish_to: 'none'

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  sanyan_network:
    path: ../../foundation_packages/sanyan_network
  sanyan_user:
    path: ../../foundation_packages/sanyan_user
  sanyan_common_ui:
    path: ../../foundation_packages/sanyan_common_ui
  sanyan_routes:
    path: ../../foundation_packages/sanyan_routes
  sign_in_with_apple: ^6.1.0
  fluwx: ^4.5.5
  crypto: ^3.0.3

flutter:
  assets:
    - assets/images/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  # 仅测试用：mock GetStorage 依赖的 path_provider 平台实现
  path_provider_platform_interface: any
  plugin_platform_interface: any
